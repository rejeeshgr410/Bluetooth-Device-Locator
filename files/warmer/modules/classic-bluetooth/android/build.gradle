apply plugin: 'com.android.library'

group = 'expo.modules.classicbluetooth'
version = '0.1.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

// Keep SDK levels in step with the Expo SDK rather than pinning them here.
useDefaultAndroidSdkVersions()

android {
  namespace "expo.modules.classicbluetooth"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}
